general {
    immediate_render = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = $HOME/.config/hypr/lock_wallpaper.png   
    color = rgba(25,20,20,1.0)

    # Sonoma defaults to a sharp lockscreen image 
    blur_passes = 0 
    blur_size = 8
    noise = 0.0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# DATE (Crisp, flat transparency)
label {
    monitor =
    text = cmd[update:1000] echo "<span font_family='SF Pro Display' font_weight='bold' size='22000'>$(date +"%A, %B %d")</span>"
    color = rgba(255, 255, 255, 0.85) 
    position = 0, -100
    halign = center
    valign = top
    
    # Zero shadows. No glow, no mud.
    shadow_passes = 0
}

# TIME (Pure macOS blending)
label {
    monitor =
    text = cmd[update:1000] echo "<span font_family='SF Pro Display' font_weight='heavy' size='95000'>$(date +"%H:%M")</span>"
    color = rgba(255, 255, 255, 0.65) # 65% opacity lets the wallpaper naturally bleed through
    position = 0, -140
    halign = center
    valign = top
    
    # Completely disable the shadow engine here
    shadow_passes = 0
}

# USER AVATAR (Small circle, floating near the bottom)
image {
    monitor =
    path = $HOME/.config/hypr/lock_avatar.png
    size = 80
    rounding = -1 # perfect circle
    border_size = 0
    
    position = 0, 210
    halign = center
    valign = bottom
    
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0,0,0,0.4)
    shadow_boost = 1.2
}

# USER NAME LABEL (Medium-bold, just above the password pill)
label {
    monitor =
    text = <span font_family="SF Pro Display" font_weight="bold" size="14000">Vishvaa K</span>
    color = rgba(255,255,255,0.95)
    
    position = 0, 160
    halign = center
    valign = bottom
    
    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(0,0,0,0.4)
    shadow_boost = 1.2
}

# PASSWORD INPUT FIELD (Compact, translucent pill)
input-field {
    monitor =
    size = 200, 34
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    
    # macOS style subtle frosted glass pill
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = rgba(255, 255, 255, 0.9)
    
    fade_on_empty = false
    placeholder_text = <span font_family="SF Pro Text" font_weight="regular" size="10000" foreground="##ffffffaa">Enter Password</span>
    hide_input = false
    rounding = -1 
    
    check_color = rgba(255, 255, 255, 0.3)
    fail_color = rgba(255, 50, 50, 0.5)
    fail_text = <span font_family="SF Pro Text" font_weight="regular" size="10000" foreground="##ffffff">Incorrect Password</span>
    fail_transition = 300 
    
    capslock_color = rgba(255, 255, 255, 0.3)
    numlock_color = rgba(255, 255, 255, 0.3)
    bothlock_color = rgba(255, 255, 255, 0.3)
    
    position = 0, 110
    halign = center
    valign = bottom
    
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0,0,0,0.3)
    shadow_boost = 1.2
}

# PASSWORD SUBTEXT (Touch ID / Password prompt)
label {
    monitor =
    text = <span font_family="SF Pro Text" font_weight="regular" size="9000">Touch ID or Enter Password</span>
    color = rgba(255,255,255,0.6)
    
    position = 0, 75
    halign = center
    valign = bottom
    
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0,0,0,0.3)
    shadow_boost = 1.2
}

# POWER CONTROLS: SLEEP
label {
    monitor =
    text = <span font_family="SF Pro Text" font_weight="medium" size="10000">Sleep</span>
    color = rgba(255,255,255,0.75)
    position = -120, 30
    halign = center
    valign = bottom
    onclick = systemctl suspend
}

# POWER CONTROLS: RESTART
label {
    monitor =
    text = <span font_family="SF Pro Text" font_weight="medium" size="10000">Restart</span>
    color = rgba(255,255,255,0.75)
    position = 0, 30
    halign = center
    valign = bottom
    onclick = systemctl reboot
}

# POWER CONTROLS: SHUT DOWN
label {
    monitor =
    text = <span font_family="SF Pro Text" font_weight="medium" size="10000">Shut Down</span>
    color = rgba(255,255,255,0.75)
    position = 120, 30
    halign = center
    valign = bottom
    onclick = systemctl poweroff
}